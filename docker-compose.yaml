services:
  index-tts:
    build: .
    image: index-tts-server
    env_file:
      - .env.example
    environment:
      APP_SERVER: ${APP_SERVER:-web}
      MODEL: ${MODEL:-}
      VLLM_USE_MODELSCOPE: ${VLLM_USE_MODELSCOPE:-}
      CONVERT_MODEL: ${CONVERT_MODEL:-}
      DOWNLOAD_MODEL: ${DOWNLOAD_MODEL:-1}
      MODEL_DIR: ${MODEL_DIR:-checkpoints}
      PORT: ${PORT:-8000}
    container_name: index-tts-server
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./assets:/app/assets
      - ./outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30m
